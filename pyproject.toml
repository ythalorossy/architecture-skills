# Dev-tool configuration only.
#
# This repository is not a pip package and is never installed: the skill runs
# as plain scripts from skills/c4-diagrams/scripts/. There is deliberately no
# [project] table, build-system or dependency list, so nothing here can be
# mistaken for runtime metadata. The runtime is stdlib-only; coverage and ruff
# are dev tools, installed in .github/workflows/ci.yml.

[tool.ruff]
# The oldest Python the skill supports. Also stops ruff suggesting syntax
# that older interpreters can't run.
target-version = "py311"
line-length = 120

# Not first-party code:
#   * tests/fixtures/** — small third-party repositories used as analyzer
#     input, some deliberately malformed. Findings there would be about the
#     fixture, not about us.
#   * tests/golden/**   — generated snapshots, never hand-edited.
# Excluding these directories (not `tests/` as a whole) keeps tests/test_*.py
# under lint.
extend-exclude = ["tests/fixtures", "tests/golden"]

[tool.ruff.lint]
# E9   syntax/indentation errors
# F63  comparison mistakes (e.g. `is` with a literal)
# F7   syntax-adjacent mistakes (e.g. `l = 1l`, `break` outside a loop)
# F82  undefined or misspelled names
select = ["E9", "F63", "F7", "F82"]
