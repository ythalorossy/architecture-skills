# The test suite on Python 3.11-3.13, Linux and Windows, plus lint, coverage
# and a check that the CLIs refuse Python 3.10 with a clear message.
#
# The skill's runtime is stdlib-only, so the `test` jobs install nothing.
# `coverage` and `ruff` are dev tools, installed in their own jobs. The suite
# needs no network, Node.js or mmdc (tests/helpers.py sets C4_SVG=0).
name: CI

on:
  push:
  pull_request:

# The workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every leg: a Windows-only path bug should not hide behind a
      # Linux failure, and vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests

  # Coverage is reported in the run summary; there is no threshold, so this
  # job never fails the build on a coverage number.
  coverage:
    name: coverage (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage (dev tool)
        run: python -m pip install coverage

      - name: Measure coverage of the skill scripts
        run: |
          coverage run --source=skills/c4-diagrams/scripts -m unittest discover -s tests
          coverage report -m | tee coverage.txt
          {
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (dev tool, pinned so a ruff release can't turn CI red)
        run: python -m pip install ruff==0.17.0

      # The rules live in pyproject.toml [tool.ruff], so a local
      # `ruff check skills tests evals` behaves identically.
      - name: Run ruff
        run: ruff check skills tests evals

  # The renderer tests against the real, pinned mermaid-cli (the rest of the
  # suite uses a fake). Not a required check: it downloads mermaid-cli and a
  # headless Chrome, so a network hiccup shouldn't block a merge.
  real-render:
    name: real render (ubuntu, mermaid-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Ubuntu 24.04 runners block the unprivileged user namespaces that
      # headless Chrome's sandbox needs ("Failed to launch the browser process").
      - name: Allow Chrome's sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Render with the real mermaid-cli
        env:
          C4_REAL_RENDER: "1"
          C4_SVG_TIMEOUT_INSTALL: "900"
        run: python -m unittest discover -s tests -p "test_*.py" -k Real -k Adversarial -v

  # Below the 3.11 floor both CLIs must exit 1 and say why, rather than
  # crashing on a syntax or import error.
  guard:
    name: version guard (py3.10 fails fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: analyze_repository.py must exit 1 on Python 3.10
        run: |
          set +e
          output="$(python skills/c4-diagrams/scripts/analyze_repository.py --help 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::analyze_repository.py --help must exit 1 on Python 3.10, got $status"
            exit 1
          fi
          case "$output" in
            *"Python 3.11+ is required"*) ;;
            *)
              echo "::error::guard message missing; got: $output"
              exit 1
              ;;
          esac

      - name: render_c4.py must exit 1 on Python 3.10
        run: |
          set +e
          output="$(python skills/c4-diagrams/scripts/render_c4.py --help 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::render_c4.py --help must exit 1 on Python 3.10, got $status"
            exit 1
          fi
          case "$output" in
            *"Python 3.11+ is required"*) ;;
            *)
              echo "::error::guard message missing; got: $output"
              exit 1
              ;;
          esac